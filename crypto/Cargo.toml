[package]
name = "drop-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Transfer codes, SPAKE2 key agreement, and chunk sealing for Drop"
license = "MIT"
repository = "https://github.com/op-q/drop"
publish = false

[lib]
name = "drop_crypto"
path = "src/lib.rs"

# Its own crate rather than a module inside the CLI. It was split out so a
# browser client could compile the same code to WebAssembly instead of keeping a
# second implementation byte-identical by hand (docs/decisions.md entry 11).
# That client was removed in 0.4.0 (entry 17). The split stays because it is
# worth having on its own: the envelope has no I/O and no transport in reach,
# the relay shares its constants without linking the CLI, and whatever compiles
# it next, a browser iroh node included, starts from a crate rather than a
# refactor.
[dependencies]
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
spake2 = "0.4"
rand = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
