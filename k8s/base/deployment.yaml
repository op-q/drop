apiVersion: apps/v1
kind: Deployment
metadata:
  name: drop
  labels:
    app.kubernetes.io/name: drop
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: drop
spec:
  replicas: 1
  progressDeadlineSeconds: 3700
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drop
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drop
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: drop
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drop
          image: drop:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DROP_BIND_ADDR
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: info,tower_http=info
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
