apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drop
resources:
  - ../../base
  - backend-config.yaml
  - frontend-config.yaml
  - managed-certificate.yaml
  - ingress.yaml
  - pod-disruption-budget.yaml
images:
  - name: drop
    newName: europe-north1-docker.pkg.dev/replace-project-id/drop/drop
    newTag: latest
patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
