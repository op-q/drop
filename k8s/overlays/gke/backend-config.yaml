apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: drop-backend
spec:
  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 3600
  healthCheck:
    type: HTTP
    requestPath: /ready
    port: 8080
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
