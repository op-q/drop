[workspace]
members = ["cli"]

[package]
name = "api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An ephemeral real-time file-transfer relay built with Rust and WebSockets"
license = "MIT"
repository = "https://github.com/op-q/drop"
readme = "README.md"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = "0.5"
