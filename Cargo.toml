[workspace]
members = ["cli", "crypto", "crypto-wasm"]

# One version for the whole workspace. Every member inherits it, so the relay
# and the CLI cannot drift apart and there is a single line to bump before a
# release.
[workspace.package]
version = "0.2.0"

[package]
name = "api"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "An ephemeral real-time file-transfer relay built with Rust and WebSockets"
license = "MIT"
repository = "https://github.com/op-q/drop"
readme = "README.md"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.30"
tower = "0.5"
