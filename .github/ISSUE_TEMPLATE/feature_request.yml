name: Feature request
description: Propose a focused improvement that fits Drop's relay model.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or operator problem should this solve?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result without prescribing every implementation detail.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: tradeoffs
    attributes:
      label: Security, privacy, and operational tradeoffs
      description: Note persistence, encryption, resource, browser, protocol, or deployment implications.

  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: This does not describe Drop as peer-to-peer or end-to-end encrypted.
          required: true
        - label: This does not add file persistence without explicitly explaining the new security model.
          required: true
