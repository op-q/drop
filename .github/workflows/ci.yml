name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan for common secret shapes
        run: scripts/check-secrets.sh
      - name: Check whitespace
        run: git show --check --oneline --decorate HEAD

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0
      - name: Render local overlay
        run: kubectl kustomize k8s/overlays/local > /tmp/drop-local.yaml
      - name: Render GKE overlay
        run: kubectl kustomize k8s/overlays/gke > /tmp/drop-gke.yaml
      - name: Check GKE shutdown budget fits Autopilot
        run: scripts/check-gke-shutdown-budget.sh /tmp/drop-gke.yaml
