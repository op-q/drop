name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan for common secret shapes
        run: scripts/check-secrets.sh
      - name: Check whitespace
        run: git show --check --oneline --decorate HEAD

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web build compiles `crypto-wasm/` instead of reimplementing the
      # envelope in TypeScript, so this is no longer a pure Node build.
      # See decisions.md entry 11.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Downloaded at a pinned version and checked against its digest, rather
      # than piped from an installer script or compiled from source on every
      # run.
      - name: Install wasm-pack
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o wasm-pack.tar.gz \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz --strip-components=1
          sudo install -m 0755 wasm-pack /usr/local/bin/wasm-pack
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      # `web/tests/interop.test.mjs` drives a real relay and the real CLI, and
      # skips itself when those binaries are absent. Building them here is what
      # keeps it from skipping silently, which would be worse than not having
      # the test at all.
      - name: Build the relay and CLI for the interoperation test
        working-directory: ${{ github.workspace }}
        run: cargo build --workspace --bins
      - name: Test
        run: npm test

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0
      - name: Render local overlay
        run: kubectl kustomize k8s/overlays/local > /tmp/drop-local.yaml
      - name: Render GKE overlay
        run: kubectl kustomize k8s/overlays/gke > /tmp/drop-gke.yaml
      - name: Check GKE shutdown budget fits Autopilot
        run: scripts/check-gke-shutdown-budget.sh /tmp/drop-gke.yaml
