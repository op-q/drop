name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Was JavaScript and TypeScript, which analysed the browser client. With it
    # gone there is no TypeScript left, and the code worth scanning is Rust.
    # Renaming the job renames its check: branch protection's required check
    # "Analyze JavaScript and TypeScript" has to become "Analyze Rust" in the
    # repository settings when this lands, or pull requests wait on a check
    # that never reports.
    name: Analyze Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: rust
          # Rust is analysed from source, without a build. Faster, and it
          # needs no toolchain setup in this job.
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
