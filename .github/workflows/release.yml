name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # v0.1.1 shipped a binary that reports 0.1.0, because the manifest was never
  # bumped and nothing compared the two. A `drop --version` that disagrees with
  # the tag it was built from is only ever discovered by a user, so the release
  # stops here rather than producing one.
  verify:
    name: Tag matches the manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Compare the tag with the workspace version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag manifest=$version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the workspace version $version in Cargo.toml. Bump the version before tagging."
            exit 1
          fi
      # 0.2.0 and 0.3.0 were published with no text at all. The release action
      # only warns about a missing notes file and publishes an empty page
      # anyway, so the check is here, before anything is built. The rules for
      # writing the notes are in AGENTS.md.
      - name: Require release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty. Write the release notes before tagging; see Release notes in AGENTS.md."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # A target marked experimental may fail without stopping the release: the
    # publish job's `needs` treats it as done, and its asset is simply absent.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target, so nothing is cross-compiled.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # `macos-13` was retired in December 2025. A job asking for it is
          # never assigned a runner: it queues forever rather than failing,
          # and `timeout-minutes` does not apply to queueing, so the whole
          # release stalls behind it. `macos-15-intel` is the Intel
          # replacement, available until August 2027, after which GitHub
          # drops x86_64 macOS entirely and this target has to go.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          # Windows ships as a zip holding drop.exe. See
          # docs/plans/cross-platform-plan-2026-09-14.md, phase 3.
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          # Experimental: ring has needed clang on Arm Windows before, and a
          # toolchain problem on one runner must not hold back a release.
          # Windows 11 on Arm runs the x86_64 build under emulation meanwhile.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The TLS stack builds C code, so a musl target needs a musl C toolchain.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_$(echo ${{ matrix.target }} | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        # The C runtime linked statically on Windows, so drop.exe starts on a
        # machine without the Visual C++ redistributable, for the same reason
        # the Linux targets are musl. Set here rather than in a cargo config:
        # with `--target`, RUSTFLAGS reach only the target's artifacts and not
        # the build scripts and proc-macros compiled for the host.
        env:
          RUSTFLAGS: ${{ endsWith(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --package drop-cli --target ${{ matrix.target }}

      - name: Verify the binary runs
        # A cross-built binary cannot be executed on the runner, but every
        # target here is native, so a binary that will not start is caught now
        # rather than by the first person to install it.
        shell: bash
        run: ./target/${{ matrix.target }}/release/drop --version

      - name: Package (tar.gz)
        if: ${{ !endsWith(matrix.target, 'windows-msvc') }}
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/drop" "${staging}/drop"
          cp LICENSE README.md "${staging}/"
          tar -czf "drop-${{ matrix.target }}.tar.gz" -C "${staging}" drop LICENSE README.md

      - name: Package (zip)
        if: ${{ endsWith(matrix.target, 'windows-msvc') }}
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'drop-package'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/drop.exe", LICENSE, README.md $staging
          Compress-Archive -Force -Path (Join-Path $staging '*') -DestinationPath "drop-${{ matrix.target }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: drop-${{ matrix.target }}
          path: |
            drop-${{ matrix.target }}.tar.gz
            drop-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only for the two installers and the release notes below; the binaries
      # and checksums come from the build job's artifacts, not from this
      # checkout.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            scripts/install.sh
            scripts/install.ps1
            docs/releases/${{ inputs.tag || github.ref_name }}.md
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum drop-*.tar.gz drop-*.zip > checksums.txt
          cat checksums.txt

      - name: Publish to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.tag || github.ref_name }}.md
          files: |
            artifacts/drop-*.tar.gz
            artifacts/drop-*.zip
            artifacts/checksums.txt
            scripts/install.sh
            scripts/install.ps1
          fail_on_unmatched_files: true
