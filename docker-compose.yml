services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DROP_BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - app
    environment:
      DROP_SITE_ADDRESS: ${DROP_SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
